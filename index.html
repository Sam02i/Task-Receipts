<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Task Receipts</title>
    <link rel="stylesheet" href="styles1.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body>
    <!-- Wallpaper layer -->
    <div id="appWallpaper"></div>
    <div id="appWallpaperOverlay"></div>
    <script>
        (function() {
            var theme = localStorage.getItem('tr_app_theme') || 'classic';
            document.body.setAttribute('data-app-theme', theme);
            if (theme === 'seaside') {
                var el = document.getElementById('appWallpaper');
                if (el) { el.style.backgroundImage = "url('wallpaper.jpg')"; el.style.opacity = '1'; }
            }
        })();
    </script>
    <header>
            <div class="logo">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="3" width="18" height="18" rx="2"/>
                    <line x1="3" y1="9" x2="21" y2="9"/>
                    <line x1="9" y1="21" x2="9" y2="9"/>
                </svg>
                <span>TASK RECEIPTS</span>
            </div>
            <div class="header-actions">
                <button class="mute-toggle" id="muteToggle" title="Toggle sounds">
                    <svg id="muteIcon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <polygon points="11,5 6,9 2,9 2,15 6,15 11,19"/>
                        <path d="M15.54 8.46a5 5 0 0 1 0 7.07"/>
                        <path d="M19.07 4.93a10 10 0 0 1 0 14.14"/>
                    </svg>
                </button>
                <button class="end-session-btn" id="endSessionBtn">End Session</button>
                <div class="creator">Created by Samiksha</div>
            </div>
        </header>

    <div class="container">
        <div class="main-content">
            <div class="left-panel">
                <div class="flip-clock">
                    <div class="clock-enclosure">
                        <div class="clock-top-bar">
                            <span class="clock-label">Choose next task</span>
                        </div>
                        <div class="clock-display">
                            <div class="flip-digit" id="flipMin1">0</div>
                            <div class="flip-digit" id="flipMin2">0</div>
                            <div class="flip-colon">:</div>
                            <div class="flip-digit" id="flipSec1">0</div>
                            <div class="flip-digit" id="flipSec2">0</div>
                        </div>
                        <div class="clock-bottom-bar">
                            <span class="breaks-count" id="breaksCount">0 breaks taken</span>
                        </div>
                    </div>
                </div>

                <div class="timer-controls">
                    <button class="control-btn" id="playBtn">
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><polygon points="5,3 19,12 5,21"/></svg>
                    </button>
                    <button class="control-btn" id="pauseBtn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="4" width="4" height="16"/><rect x="14" y="4" width="4" height="16"/></svg>
                    </button>
                    <button class="control-btn" id="checkBtn" disabled>
                        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><polyline points="20,6 9,17 4,12"/></svg>
                    </button>
                </div>

                <div class="task-section">
                    <div class="task-header">
                        <span>TASK LIST</span>
                        <button class="add-task-btn" id="addTaskBtn">+</button>
                    </div>
                    
                    <div class="task-tabs">
                        <button class="tab active" data-tab="ongoing">ongoing</button>
                        <button class="tab" data-tab="done">done</button>
                    </div>

                    <div class="task-input-container" id="taskInputContainer" style="display:none;">
                        <input type="text" id="taskInput" placeholder="What do you want to finish?">
                        <button class="add-btn" id="addBtn">ADD</button>
                    </div>

                    <div class="task-list" id="taskList">
                        <div class="no-tasks">No tasks yet. Hit + to add one.</div>
                    </div>
                </div>
            </div>

            <div class="right-panel">
                <div class="scene">
                    <img src="tray.png" alt="Tray" class="tray-image">
                    <div class="printer-slot"></div>
                    <div class="camera-wrapper">
                        <img src="camera.png" alt="Camera" class="camera-image">
                        <div class="camera-screen" id="cameraScreen">
                            <canvas id="screenCanvas"></canvas>
                            <div class="rec-indicator" id="recIndicator">
                                <div class="rec-dot"></div>
                                <span>REC</span>
                            </div>
                        </div>
                    </div>
                    <div class="receipts-area" id="receiptsArea"></div>
                    <button class="session-summary-btn" onclick="window.location.href='./session-summary.html'">Session summary</button>
                </div>
            </div>
        </div>
    </div>
    </div>

    <div class="modal-overlay" id="modalOverlay" style="display:none;">
        <div class="modal">
            <button class="modal-close" id="modalClose">×</button>
            <div class="modal-screen">
                <video id="modalVideo" autoplay playsinline></video>
                <canvas id="modalDrawCanvas" style="display:none;"></canvas>
            </div>
            
            <div class="theme-selector">
                <span class="theme-label">Receipt:</span>
                <button class="theme-btn active" data-theme="theme-white">White</button>
                <button class="theme-btn" data-theme="theme-cream">Cream</button>
                <button class="theme-btn" data-theme="theme-red">Red</button>
                <button class="theme-btn" data-theme="theme-blue">Blue</button>
                <button class="theme-btn" data-theme="theme-green">Green</button>
                <button class="theme-btn" data-theme="theme-pink">Pink</button>
            </div>

            <div class="dither-selector" id="ditherSelector">
                <span class="theme-label">Filter:</span>
                <button class="dither-btn active" data-dither="dotmatrix">Dot Matrix</button>
                <button class="dither-btn" data-dither="floyd">Floyd-Steinberg</button>
                <button class="dither-btn" data-dither="atkinson">Atkinson</button>
                <button class="dither-btn" data-dither="bayer">Bayer Grid</button>
                
                <label class="low-ink-label" style="font-size: 10px; color: #666; margin-left: 12px; display: inline-flex; align-items: center; gap: 4px; cursor: pointer; user-select: none;">
                    <input type="checkbox" id="lowInkCheckbox" style="cursor: pointer;">
                    Low Ink
                </label>
            </div>

            <div class="drawing-tools" id="drawingTools" style="display:none;">
                <div class="color-picker">
                    <span class="tool-label">Color:</span>
                    <button class="color-btn active" data-color="#000000" style="background:#000"></button>
                    <button class="color-btn" data-color="#e03131" style="background:#e03131"></button>
                    <button class="color-btn" data-color="#fcc419" style="background:#fcc419"></button>
                    <button class="color-btn" data-color="#c0cfb2" style="background:#c0cfb2"></button>
                    <button class="color-btn" data-color="#4682B4" style="background:#4682B4"></button>
                    <button class="color-btn" data-color="#FFAEFF" style="background:#FFAEFF"></button>
                </div>
                <div class="brush-sizes">
                    <span class="tool-label">Size:</span>
                    <button class="brush-btn" data-size="2">S</button>
                    <button class="brush-btn active" data-size="4">M</button>
                    <button class="brush-btn" data-size="8">L</button>
                </div>
            </div>

            <div class="modal-controls">
                <div class="mode-toggle">
                    <button class="mode-btn active" data-mode="photo">Photo</button>
                    <button class="mode-btn" data-mode="draw">Hand drawn</button>
                </div>
                <button class="capture-btn" id="modalCaptureBtn">
                    <div class="shutter-inner"></div>
                </button>
                <button class="signoff-btn" id="modalSignOffBtn">Sign off</button>
            </div>
        </div>
    </div>

    <script src="js1.js"></script>

    <!-- ── THEME SETTINGS PANEL (Phase 1) ── -->
    <button class="settings-btn" id="settingsBtn" title="App Theme Settings">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="12" cy="12" r="3"/>
            <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 2.83-2.83l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/>
        </svg>
    </button>

    <div class="settings-panel" id="settingsPanel">
        <div class="settings-panel-title">⚙ APP THEME</div>
        <div class="settings-section-label">Theme</div>
        <button class="app-theme-btn active" data-app-theme="classic">
            <span class="theme-dot" style="background:#d8d8d0; border:1px solid #bbb;"></span>Classic Retro
        </button>
        <button class="app-theme-btn" data-app-theme="seaside">
            <span class="theme-dot" style="background:#1a8a9a;"></span>Ocean Tide
        </button>
    </div>
</body>
</html>
